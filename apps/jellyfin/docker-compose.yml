# Jellyfin media VM. Six services here because they share NFS exports: metube writes the
# `youtube` export Jellyfin reads, rclone-webdav serves the `jelly-share` export Jellyfin reads.
# Splitting them means mounting each export from two VMs.
#
# `jellyfin` has no network of its own — it runs in gluetun's namespace, so its egress leaves
# through ProtonVPN and everything addresses it as `gluetun:8096`, never `jellyfin:8096`.
services:

  # --- Sidecar Caddy: the ONLY host-published port on this VM ---
  # Demultiplexes four subdomains off :80 by Host header (see ./Caddyfile).
  caddy:
    image: caddy:2.8-alpine
    # `caddy-<app>`, not plain `caddy` — that name belongs to the Global Caddy.
    container_name: caddy-jellyfin
    restart: unless-stopped
    networks: [edge, frontend]
    ports:
      - "${SIDECAR_PORT:-80}:80"
    # Vars named per service, not `env_file: .env` — that would hand the Postgres password and
    # JWT secret to all six containers.
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}   # the Caddyfile's host matchers
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy:/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # --- gluetun: the VPN namespace that `jellyfin` runs inside ---
  # NET_ADMIN + /dev/net/tun are irreducible for a VPN client — it creates and routes the tunnel.
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun
    restart: unless-stopped
    # `edge` for the WireGuard endpoint. gluetun's firewall accepts input only from its attached
    # subnets, so the sidecar and jellystat must share `frontend` with it to reach Jellyfin.
    networks: [edge, frontend]
    # What Jellyfin advertises. Set here, not on `jellyfin` — the namespace is gluetun's.
    hostname: jellyfin
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # Explicit, though this is also gluetun's default path for the key.
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - TZ=${TZ}
    secrets: [wireguard_private_key]
    # read_only: false — rewrites iptables state and servers.json at runtime.
    read_only: false
    volumes:
      - ./volumes/gluetun/auth:/gluetun/auth/
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 100

  # --- Jellyfin: linuxserver.io image, so identity is PUID/PGID (never `user:`) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    # Label only — joining no network, this name is not in Docker's DNS; nothing can proxy to it.
    container_name: jellyfin
    restart: unless-stopped
    network_mode: "service:gluetun"
    devices:
      - /dev/dri:/dev/dri              # VAAPI hardware transcoding
    cap_drop: [ALL]
    # s6-overlay: chowns /config to PUID:PGID on boot, then drops root.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt: [no-new-privileges:true]
    environment:
      # Hardcoded, not .env — must match the volume mounts and the sidecar route.
      - PUID=975
      - PGID=975
      - TZ=${TZ}
      - JELLYFIN_CACHE_DIR=/cache
      - DOTNET_SYSTEM_IO_DISABLEFILELOCKING=true
      # https, not http — TLS terminates at the Global Caddy; clients only see the HTTPS origin.
      - JELLYFIN_PublishedServerUrl=https://tv.${BASE_DOMAIN}
    # read_only: false — s6-overlay writes across the rootfs during init; a tmpfs per s6 path is
    # more fragile than a writable layer. The durable data is in the volumes below.
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=2048m  # ffmpeg scratch during transcodes
    volumes:
      - ./volumes/jellyfin/config:/config
      - ./volumes/jellyfin/transcodes:/transcode
      - ./volumes/jellyfin/cache:/cache
      # :rw only where Jellyfin writes — /media for delete-from-UI and write-back metadata. The
      # other two are :ro, so a Jellyfin fault cannot damage metube's downloads or the drop-box.
      - jelly-storage:/media:rw
      - youtube:/youtube:ro
      - jelly-share:/shared:ro
    mem_limit: 4g                      # starting value — ffmpeg spikes here
    # cpus: deliberately unset — transcoding should use every core.
    pids_limit: 512
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 ls /media >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- metube: YouTube downloader ---
  metube:
    image: ghcr.io/alexta69/metube:2026.07.21
    container_name: metube
    restart: unless-stopped
    # `edge` for egress — NOT behind the VPN; it kept the source stack's direct egress.
    networks: [edge, frontend]
    user: "975:975"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - TZ=${TZ}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - youtube:/downloads:rw
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256

  # --- rclone-webdav: serves the jelly-share export over WebDAV ---
  # `apk add rclone` at every start, as the source stack had it. Hence `edge` (Alpine mirrors
  # just to boot), no read_only, and no `user:` — apk needs root; rclone then serves as 975:975.
  # The rclone version is whatever Alpine ships the day the container restarts.
  rclone-webdav:
    image: alpine:3.24.1
    container_name: rclone-webdav
    restart: unless-stopped
    networks: [edge, frontend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
    read_only: false                   # apk installs into the rootfs
    volumes:
      - jelly-share:/data:rw           # WebDAV clients upload here
    # `$$` escapes Compose interpolation so the shell expands these at runtime — the password
    # stays out of the committed file and out of `docker inspect`. Quoted for passwords with
    # spaces. `exec` makes rclone PID 1, so it gets SIGTERM directly on `compose down`.
    command:
      - sh
      - -c
      - |
        apk add --no-cache rclone &&
        exec rclone serve webdav /data --addr :8080 \
          --user "$$RCLONE_USER" --pass "$$RCLONE_PASS" \
          --uid 975 --gid 975
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 100

  # --- Jellystat: usage statistics, on its own Postgres. Reaches Jellyfin at gluetun:8096. ---
  jellystat:
    image: cyfershepard/jellystat:1.1.11
    container_name: jellystat
    restart: unless-stopped
    networks: [frontend, backend]
    depends_on:
      jellystat-db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # No *_FILE support — hence an .env value shared with the db, not a file-secret.
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=${TZ}
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./volumes/jellystat/backup:/app/backend/backup-data
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: "json-file"
      options: { max-file: "5", max-size: "10m" }
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Jellystat's database: `backend` only, no egress, unreachable from the sidecar ---
  jellystat-db:
    image: postgres:18.4-alpine
    container_name: jellystat-db
    restart: unless-stopped
    networks: [backend]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # postgres init needs these
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp", "/run"]
    volumes:
      # MUST stay /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18 moved the data
      # dir to /var/lib/postgresql/18/docker, which is what the existing cluster was created
      # under. The other path presents initdb an empty dir; it starts a fresh cluster.
      - ./volumes/jellystat/db:/var/lib/postgresql
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    logging:
      driver: "json-file"
      options: { max-file: "5", max-size: "10m" }
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge: {}                     # bridge: sidecar's published port; egress for gluetun/metube/rclone
  frontend: {internal: true}   # sidecar <-> proxied services, no internet
  backend: {internal: true}    # jellystat <-> its database, no internet

secrets:
  wireguard_private_key:
    file: ./secrets/wireguard_private_key

# NFS-backed named volumes. Mounted by the VM host's kernel, so they work even on internal-only
# networks. Always `soft` — `hard` has caused hangs here. The daemon mounts each export rw;
# read-only is enforced per-container at the mount with :ro (see jellyfin above).
volumes:
  jelly-storage:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},rw,soft,timeo=30,retrans=3,intr"
      device: "${NFS_SERVER}:/export/jellyfin"
  jelly-share:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},rw,soft,timeo=30,retrans=3,intr"
      device: "${NFS_SERVER}:/export/jellyfin-share"
  youtube:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},rw,soft,timeo=30,retrans=3,intr"
      device: "${NFS_SERVER}:/export/youtube"
