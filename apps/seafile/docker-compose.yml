# Seafile CE 13 — core-only: no SeaDoc, notification server, AI/face-recognition, OnlyOffice/Collabora.
#
# Diverges from upstream's published stack (manual.seafile.com/13.0):
#   1. Upstream's caddy.yml runs caddy-docker-proxy with /var/run/docker.sock mounted (golden
#      rule: never the Docker socket) — dropped; routing reimplemented in Sidecar Caddy (./Caddyfile).
#   2. redis/mariadb pinned exactly — upstream leaves them loose.
#   3. Only the sidecar publishes a port — upstream's services all do.
#   4. Upstream's single seafile-net becomes the house three-network split.
#
# seafile has NO egress (frontend+backend only) — verified against the image: CE 13.0 bakes in
# binaries/deps at build time, and scripts_13.0/{enterpoint.sh,start.py,bootstrap.py,
# setup-seafile-mysql.py,upgrade.py} make zero outbound calls. Only SMTP would need it (README, .env.example).
services:

  # --- Sidecar Caddy: the ONLY host-published port on this VM ---
  # One subdomain: listens on :80 unconditionally — no host matcher, no BASE_DOMAIN needed
  # (contrast jellyfin, which demuxes four).
  caddy:
    image: caddy:2.8-alpine
    # `caddy-<app>`, not plain `caddy` — that name belongs to the Global Caddy.
    container_name: caddy-seafile
    restart: unless-stopped
    networks: [edge, frontend]
    ports:
      - "${SIDECAR_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy:/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    logging:
      driver: "json-file"
      options: { max-file: "5", max-size: "10m" }

  # --- Seafile server (nginx + seaf-server + seahub/gunicorn in one container) ---
  seafile:
    image: seafileltd/seafile-mc:13.0.25
    container_name: seafile
    restart: unless-stopped
    networks: [frontend, backend]
    # No `user:` here on purpose. Phusion baseimage: PID 1 is /sbin/my_init as root, supervising
    # nginx/syslog-ng/cron via runit. NON_ROOT=true (.env) makes enterpoint.sh useradd uid 8000 at
    # runtime; start.py then runs the servers via `su seafile`. Forcing `user: 8000:8000` here
    # breaks that — useradd can't write /etc/passwd, my_init can't start services. Two-phase first
    # boot required — see README "Non-root bring-up".
    env_file: [.env]
    environment:
      # Pinned here, not .env: a stray edit to the gitignored file can't silently enable an
      # undeployed/unhardened component.
      - ENABLE_SEADOC=false
      - ENABLE_NOTIFICATION_SERVER=false
      - ENABLE_SEAFILE_AI=false
      - ENABLE_FACE_RECOGNITION=false
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # UNVERIFIED starting set — /harden-container must measure this down.
    #   CHOWN, FOWNER, DAC_OVERRIDE  enterpoint.sh chowns /opt/seafile + server dir to seafile;
    #                                bootstrap.py moves conf/ccnet/seafile-data into /shared
    #   SETUID, SETGID               `su seafile -c ...` in start.py; runit's setuser
    #   KILL                         runit/my_init signalling supervised services on shutdown
    #   AUDIT_WRITE                  PAM audit record on `su`
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, AUDIT_WRITE]
    # DEVIATION from ADR-0003 (recorded in app.meta.yaml): not achievable on this image. runit
    # creates supervise/ dirs in place under /etc/service/{nginx,syslog-ng,cron}, which can't be
    # tmpfs-mounted without masking the run scripts; enterpoint.sh also mutates the image fs on
    # every boot — groupadd/useradd write /etc/{passwd,group,shadow}, crontab writes
    # /var/spool/cron, and it sed-edits /scripts and seafile.sh.
    read_only: false
    volumes:
      # conf/, ccnet/, seafile-data/ (the block store), seahub-data/ (avatars, thumbnails,
      # logos), logs/ — local by decision. Block store is latency/write-order sensitive; house
      # NFS options are `soft`.
      - ./volumes/seafile:/shared
    mem_limit: 4g
    cpus: "2.5"
    pids_limit: 512
    logging:
      driver: "json-file"
      options: { max-file: "5", max-size: "10m" }
    healthcheck:
      # In-container nginx fronts seahub on :80; a 200 here means the whole chain is up.
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s     # first boot runs setup-seafile-mysql.py; be generous
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- MariaDB (isolated: backend only, no egress, sidecar cannot reach it) ---
  # MariaDB, not Postgres: only engine Seafile supports. Datadir stays local — never NFS.
  db:
    image: mariadb:10.11.18
    container_name: db
    restart: unless-stopped
    networks: [backend]
    environment:
      # First-boot only: MariaDB ignores this once /var/lib/mysql is initialised. seafile needs
      # the same value (INIT_SEAFILE_MYSQL_ROOT_PASSWORD, from .env) to create the three
      # databases and the `seafile` user. README covers blanking it afterward.
      - MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:-}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Same shape as the postgres example in apps/_template: entrypoint starts as root, fixes
    # ownership of datadir + socket dir, then drops to mysql. UNVERIFIED.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    read_only: true
    # /run/mysqld holds the unix socket + pidfile; entrypoint creates and chowns it.
    tmpfs: ["/tmp", "/run/mysqld"]
    volumes:
      - ./volumes/db:/var/lib/mysql
    mem_limit: 2g
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: "json-file"
      options: { max-file: "5", max-size: "10m" }
    healthcheck:
      test:
        ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  # --- Redis (cache only; replaced memcached as the v13 default) ---
  # `--save "" --appendonly no` = pure in-memory cache, no persistence — nothing on disk to lose,
  # and what lets it run fully read_only with zero capabilities.
  redis:
    # 7.4, not 8.x: image uid/gid (see `user:` below) is only verifiable from source, and neither
    # docker-library/redis nor redis/docker-library-redis publishes Dockerfiles past 7.4 — 8.x
    # values unconfirmed. 7.4.9 is current/maintained; Seafile only uses Redis as a cache
    # (django-redis), so nothing here needs an 8.x feature.
    image: redis:7.4.9-alpine
    container_name: redis
    restart: unless-stopped
    networks: [backend]
    # Exec form, not upstream's `sh -c` wrapper: Compose interpolates ${REDIS_PASSWORD} from
    # .env at parse time, so no shell is needed inside the container.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.example}
      - --save
      - ""
      - --appendonly
      - "no"
    # Verified against the image source (not the 999:999 you'd assume):
    #   addgroup -S -g 1000 redis; adduser -S -G redis -u 999 redis
    # Also skips the entrypoint's root-only branch (chown /data + gosu), which is what lets this
    # run read_only with zero capabilities.
    user: "999:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 128
    logging:
      driver: "json-file"
      options: { max-file: "5", max-size: "10m" }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge: {}                     # bridge: the sidecar's published port. seafile is NOT a member.
  frontend: {internal: true}   # sidecar <-> seafile, no internet
  backend: {internal: true}    # seafile <-> db + redis, no internet; the sidecar cannot reach them

# No NFS volumes: all state is local under ./volumes/ by decision (app.meta.yaml).
# No `secrets:` block: secrets_mode is env — the image reads every credential via os.getenv
# (bootstrap.py) and supports no *_FILE convention, so file-secrets would only cover MariaDB
# while the same value still had to sit in seafile's environment anyway.
