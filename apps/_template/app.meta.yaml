# Machine-readable contract: drives global-route generation, linting, docs.
# `/onboard-app` fills routing fields; `/harden-container` fills caps_added / tmpfs_paths.
name: example-app
hostname: photos          # subdomain only; full host = <hostname>.{BASE_DOMAIN}
vm_ip: 10.0.0.42          # reserved static IP
sidecar_port: 80          # host port sidecar publishes

needs_egress: false       # true -> app joins `edge` network
secrets_mode: hybrid      # env | file-secrets | hybrid

# Keys must match compose service names.
services:
  caddy:
    image_type: vanilla
    read_only: false      # house default; sidecar not yet hardened
    caps_added: []
    tmpfs_paths: []
  example-app:            # = app slug, never `app` — sidecar's DNS target
    image_type: vanilla   # vanilla | self-built | linuxserver
    read_only: true
    caps_added: []        # minimum caps, from hardening bring-up loop
    tmpfs_paths: []       # writable paths unlocked (e.g. /tmp, /run)
  db:
    image_type: vanilla
    read_only: true
    caps_added: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    tmpfs_paths: [/tmp, /run]
  # --- docker-compose.backup.yml ---
  backup:
    image_type: self-built   # ghcr.io/chethan123/backup-sidecar — images/backup-sidecar/, user ${BACKUP_UID}:${BACKUP_GID}
    read_only: true
    caps_added: []
    tmpfs_paths: [/tmp, /resticprofile]
  dump:
    image_type: vanilla      # postgres, SAME tag as db — user ${BACKUP_UID}:${BACKUP_GID}
    read_only: true
    caps_added: []
    tmpfs_paths: [/tmp]

# Backup contract (ADR-0006, docs/specs/backup-sidecar.md). Mirrors docker-compose.backup.yml —
# the audit trail for what is kept, as whom, and when.
backup:
  image: ghcr.io/chethan123/backup-sidecar:1.0.0
  user: "${BACKUP_UID}:${BACKUP_GID}"   # owner of every path under sources; the dump account
  schedule: "0 3 * * *"                  # cron, UTC; this app's choice — after the dump
  sources:                               # = the :ro binds under /backup; nothing else is visible
    - {host_path: ./volumes/app,   mount: /backup/app}
    - {host_path: ./volumes/dumps, mount: /backup/dumps}
    - {host_path: ./secrets,       mount: /backup/secrets}     # encrypted at rest; spec D9
    - {host_path: ./.env,          mount: /backup/env/.env}
  dumps:                                 # every database, by its own engine; the datadir is never a source
    - {service: dump, engine: postgres, of: db, into: ./volumes/dumps, at: "02:00 UTC"}
  ping: BACKUP_PING_URL                  # .env; Uptime Kuma push monitor, one push per run

# NFS volumes (optional). Access enforced at the container mount (:ro default, :rw opt-in);
# daemon always mounts NFS `rw` with `soft` options.
# nfs_volumes:
#   - name: backup-storage
#     server: 192.168.86.250       # static IP is fine
#     export: /export/backup
#     mount_path: /data/backup
#     access: ro                   # ro (default) | rw  -> drives the :ro/:rw mount suffix

owner: chethan
