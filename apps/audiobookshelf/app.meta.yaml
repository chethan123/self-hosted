# Machine-readable contract for this app. Drives global-route generation, linting, and docs.
# `/onboard-app` fills the routing fields; `/harden-container` fills caps_added / tmpfs_paths.
name: audiobookshelf
hostname: audiobooks      # subdomain only; full host is <hostname>.{BASE_DOMAIN}
vm_ip: 10.1.1.3           # reserved static IP of this app's VM
sidecar_port: 80          # the ONE host port the Sidecar Caddy publishes

needs_egress: true        # metadata lookups + podcast episode downloads
secrets_mode: env         # env | file-secrets | hybrid — no secrets in this stack

# NOT YET VERIFIED — /harden-container has never run against this app; this is the migration's
# starting posture, not a measured result. The source stack ran with no cap_drop, no read_only —
# every hardening line here is new and untested.
hardening_verified: false

services:
  caddy:
    image_type: vanilla       # caddy:2.8-alpine
    read_only: false          # house default for the sidecar; not yet tightened anywhere
    caps_added: []
    tmpfs_paths: []
  audiobookshelf:
    image_type: vanilla       # ghcr.io/advplyr/audiobookshelf:2.35.1 — `user: 975:975`, never PUID/PGID
    read_only: true           # UNVERIFIED — likely first-boot failure
    caps_added: []            # UNVERIFIED — plain node process, expect none needed
    tmpfs_paths: [/tmp]       # 1024m, ffmpeg/ffprobe scratch + web-UI upload staging
    # uid 975 on :80 via Docker's default net.ipv4.ip_unprivileged_port_start=0, not
    # CAP_NET_BIND_SERVICE.
    unprivileged_port_bind: true

# NFS-backed volumes. Access is enforced at the container mount (:ro default, :rw opt-in); the
# daemon always mounts NFS `rw` with `soft` options.
nfs_volumes:
  - name: audiobooks
    server: 192.168.86.250        # NFS_SERVER
    export: /export/audiobooks
    mount_path: /audiobooks
    access: rw                    # in-app write-back: embed metadata, m4b merge, uploads, renames
  - name: podcasts
    server: 192.168.86.250
    export: /export/podcasts
    mount_path: /podcasts
    access: rw                    # episode downloads land here

# Local (non-NFS): ./volumes/audiobookshelf/config holds the SQLite db — must not be NFS
# (upstream docs: SQLite over NFS corrupts). ./volumes/audiobookshelf/metadata is regenerable
# cache.

owner: chethan
