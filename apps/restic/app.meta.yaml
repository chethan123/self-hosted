# Machine-readable contract for this app. Drives global-route generation, linting, and docs.
# `/onboard-app` fills the routing fields; `/harden-container` fills caps_added / tmpfs_paths.
name: restic
hostname: restic          # subdomain only; full host is <hostname>.{BASE_DOMAIN}
vm_ip: 10.1.1.200         # reserved static IP of this app's VM
sidecar_port: 80          # host port the Sidecar Caddy publishes

needs_egress: false       # rest-server only serves; the host's rclone units reach the cloud
secrets_mode: hybrid      # env | file-secrets | hybrid  (htpasswd is the one file-secret)

services:
  caddy:
    image_type: vanilla   # caddy:2.8-alpine
    read_only: false      # house default for the sidecar; not yet tightened anywhere
    caps_added: []
    tmpfs_paths: []
  restic:
    image_type: vanilla   # restic/rest-server:0.14.0 — ships no USER; `user:` required
    read_only: true
    # UNVERIFIED — VM didn't exist at onboarding, /harden-container hasn't run. Empty lists
    # aren't proven minimal.
    hardening_verified: false
    caps_added: []
    tmpfs_paths: []

# Storage targets — app-specific schema extension. Each entry is one restic repository
# namespace: `path` is the first URL segment, the container directory under /data, AND the
# htpasswd username (rest-server --private-repos pins them equal). `host_path` is a directory
# on the VM host, bind-mounted in; nothing here is managed by Docker.
storage_targets:
  - path: local
    host_path: /srv/restic/local        # RESTIC_LOCAL_PATH
    kind: disk                          # plain directory on the VM's SSD
    propagation: default
  - path: rclone-1
    host_path: /srv/restic/rclone-1     # RESTIC_RCLONE1_PATH
    kind: rclone-mount                  # host systemd `rclone mount` unit (pcloud)
    propagation: rshared                # so a remount propagates into the running container

# No nfs_volumes: every target is a host bind mount. If a NAS export becomes a target later,
# prefer the standard `nfs_volumes` block (Docker local+nfs driver) over a host mount.

owner: chethan
