# rclone-1's bind mount is `rshared`: a host remount must propagate in. Docker's
# create_host_path check can't catch an unmounted FUSE target — the mountpoint dir still exists,
# just empty — so without rshared, backups would silently land on local disk instead of pcloud.
services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy-restic
    restart: unless-stopped
    networks: [edge, frontend]
    ports:
      - "${SIDECAR_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy:/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  restic:
    image: restic/rest-server:0.14.0
    container_name: restic
    restart: unless-stopped
    networks: [frontend]
    user: "1000:1000"
    env_file: [.env]
    environment:
      - DATA_DIRECTORY=/data
      - PASSWORD_FILE=/run/secrets/htpasswd
      - OPTIONS=--append-only --private-repos ${RESTIC_EXTRA_OPTIONS:-}
    secrets: [htpasswd]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: []
    mem_limit: 512m
    cpus: "2.0"
    pids_limit: 200
    volumes:
      - type: bind
        source: ${RESTIC_LOCAL_PATH:-/srv/restic/local}
        target: /data/local
        bind:
          create_host_path: false
      - type: bind
        source: ${RESTIC_RCLONE1_PATH:-/srv/restic/rclone-1}
        target: /data/rclone-1
        bind:
          propagation: rshared
          create_host_path: false

networks:
  edge: {}
  frontend: {internal: true}

secrets:
  # bcrypt htpasswd, one line per storage target.
  htpasswd:
    file: ./secrets/htpasswd
